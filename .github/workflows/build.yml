name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk VolumenPlus.apk

      - name: Guardar APK (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: VolumenPlus-apk
          path: VolumenPlus.apk

      - name: Publicar en Releases (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Volumen+ (build ${{ github.run_number }})
          body: Descarga **VolumenPlus.apk** desde el celular e instálalo.
          files: VolumenPlus.apk
